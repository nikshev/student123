<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Фізика — розрахунки</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f9;
    --fg: #1b1b1f;
    --muted: #5b5b66;
    --card-bg: #ffffff;
    --card-border: #e2e2e8;
    --accent: #2a5cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14141a;
      --fg: #eceef2;
      --muted: #a2a2ae;
      --card-bg: #1d1d24;
      --card-border: #2d2d37;
      --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  nav.breadcrumb {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35em;
  }
  nav.breadcrumb a {
    color: var(--accent);
    text-decoration: none;
  }
  nav.breadcrumb a:hover { text-decoration: underline; }
  nav.breadcrumb .crumb-sep { opacity: 0.6; }
  nav.breadcrumb .crumb-current { color: var(--fg); }
  h1 {
    font-size: 1.5rem;
    margin: 12px 0 4px;
  }
  p.lead {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 32px;
  }
  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  li.card {
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    border-radius: 10px;
    padding: 16px 18px;
  }
  li.card a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
  }
  li.card a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <nav class="breadcrumb" aria-label="Навігація">
    <a href="../">Головна</a>
    <span class="crumb-sep" aria-hidden="true">→</span>
    <span class="crumb-current" aria-current="page">Фізика</span>
  </nav>
  <h1>Фізика</h1>
  <p class="lead">Розрахунки до курсу. Повзунки для кожного числа в задачі —
  сторінка перераховується наживо.</p>

  <!-- Один епізод = один рядок нижче. -->
  <ul class="list">
    <li class="card">
      <a href="fi04/">ФІ04 — Шлях і переміщення</a>
    </li>
    <li class="card">
      <a href="fi05/">ФІ05 — Швидкість і площа під графіком</a>
    </li>
    <li class="card">
      <a href="fi07/">ФІ07 — Радіус кривизни</a>
    </li>
    <li class="card">
      <a href="fi09/">ФІ09 — Період, частота, кутове прискорення</a>
    </li>
    <li class="card">
      <a href="fi10/">ФІ10 — Міст лінійне↔кутове</a>
    </li>
  </ul>
</main>
</body>
</html>
