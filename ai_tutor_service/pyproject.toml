[project]
name = "ai-tutor-service"
version = "0.1.0"
description = "AI Tutor Service for Open edX learning assistant — provides RAG, LLM calls, guard, limits, history and gate endpoints"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
]
addopts = "-p no:warnings"
filterwarnings = [
    "ignore::DeprecationWarning",
]